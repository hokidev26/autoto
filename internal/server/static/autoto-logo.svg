<!-- Kept geometrically identical to the rail brand mark in index.html, which is
     the canonical Autoto face: this file is a 2x scale of that 32-unit artwork
     (circle r 12.5, the same smile, and filled eye dots). Stroke is baked in
     because a standalone file gets no stylesheet. Change both together or the
     app shows two different logos again. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#4f6ef7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="32" cy="32" r="25"/>
  <path d="M21 35c3.2 4 6.8 6 11 6s7.8-2 11-6"/>
  <circle class="autoto-face-eye" cx="23" cy="25" r="2.4" fill="#4f6ef7" stroke="none"/>
  <circle class="autoto-face-eye" cx="41" cy="25" r="2.4" fill="#4f6ef7" stroke="none"/>
</svg>
