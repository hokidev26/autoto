version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  # v2 does not apply EXC0001 unless this preset is listed. Without it,
  # errcheck flags every defer store.Close() in tests (the convention here).
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
